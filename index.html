<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arpalink Radar Pro | Movement Intelligence</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
         :root {
            --primary: #2563eb;
            --success: #22c55e;
            --dark: #0f172a;
            --light: #f8fafc;
            --accent: #6366f1;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        body {
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            position: sticky;
            top: 0;
            z-index: 1001;
            /* Layering fixed */
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-text {
            font-weight: 800;
            font-size: 20px;
            color: var(--dark);
        }
        
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }
        /* Map Card & Container Fixed */
        
        .map-card {
            background: white;
            border-radius: 24px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        
        #map {
            height: 400px;
            border-radius: 18px;
            width: 100%;
            z-index: 1;
            overflow: hidden;
        }
        
        .here-label {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .section-title {
            font-weight: 800;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
        }
        
        .address-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .addr-card {
            background: white;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid #eef2f6;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }
        
        .addr-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }
        
        .addr-icon {
            background: #eff6ff;
            color: var(--primary);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .addr-info h4 {
            font-size: 14px;
            margin-bottom: 2px;
            color: var(--dark);
        }
        
        .addr-info p {
            font-size: 11px;
            color: #64748b;
        }
        
        .history-card {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .log-container {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-item {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            display: grid;
            grid-template-columns: 100px 1fr 120px;
            gap: 10px;
            font-size: 12px;
            align-items: center;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .time-badge {
            color: #6366f1;
            font-weight: 700;
        }
        
        .ip-badge {
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            color: #475569;
            font-family: monospace;
            text-align: center;
        }
        
        .btn-main {
            background: var(--dark);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-main:hover {
            background: #1e293b;
        }
        
        .ws-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            z-index: 1000;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .ws-float:hover {
            transform: scale(1.1);
        }
        
        footer {
            background: #fff;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }
        
        @media (max-width: 768px) {
            .log-item {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            .address-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-text"><i class="fas fa-satellite"></i> ARPALINK <span style="color:var(--primary)">Tracker</span></div>
        <div id="liveStatus" style="font-size:10px; font-weight:800; color:#64748b;"><i class="fas fa-circle" style="color:#cbd5e1"></i> You Offline</div>
    </header>

    <div class="container">
        <button class="btn-main" onclick="startTracking()"><i class="fas fa-play"></i> Track Trip & Share</button>

        <div class="map-card">
            <div id="map"></div>
        </div>

        <div class="section-title"><i class="fas fa-search-location" style="color:var(--primary)"></i> Visit Top Address (1km to 10km)</div>
        <div class="address-grid" id="nearGrid">
            <div style="padding: 20px; color: #64748b;">arpalink offline. Start tracking to scan area...</div>
        </div>

        <div class="section-title"><i class="fas fa-history" style="color:var(--accent)"></i>Your Movement Address with IP(shareable)</div>
        <div class="history-card">
            <div class="log-item" style="font-weight: 800; background: #f8fafc; border-radius: 8px; margin-bottom: 10px;">
                <div>TIME</div>
                <div>LAST DETECTED ADDRESS</div>
                <div>USER IP</div>
            </div>
            <div id="movementLog" class="log-container">
                <div id="noDataMsg" style="padding: 20px; text-align: center; color: #94a3b8;">No movement data recorded yet.</div>
            </div>
        </div>
    </div>

    <footer>
        <div style="font-weight: 800; margin-bottom: 10px;">Arpalink Tracker v2.0</div>
        <p style="font-size: 12px; color: #64748b;">© 2026 Arpalink. All rights reserved. Design By Manishu</p>
    </footer>

    <a href="#" id="whatsappBtn" class="ws-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker, circle, userIP = "Detecting...";
        let lastLoggedAddress = "";

        // Fetch User IP
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => userIP = data.ip)
            .catch(() => userIP = "Offline");

        function initMap(lat, lng) {
            // Map element check
            if (map) return;

            map = L.map('map', {
                zoomControl: false
            }).setView([lat, lng], 16);

            // Standard Street Map use karein agar satellite slow ho (Google Hybrid below)
            L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }).addTo(map);

            const icon = L.divIcon({
                html: '<div style="text-align:center"><div class="here-label">YOU ARE HERE</div><div style="background:var(--primary); width:14px; height:14px; border-radius:50%; border:3px solid white; margin:auto; box-shadow: 0 0 10px rgba(0,0,0,0.5)"></div></div>',
                className: 'custom-marker',
                iconSize: [80, 40],
                iconAnchor: [40, 35]
            });

            marker = L.marker([lat, lng], {
                icon: icon
            }).addTo(map);
            circle = L.circle([lat, lng], {
                radius: 100,
                color: '#2563eb',
                fillOpacity: 0.1
            }).addTo(map);

            // Refresh map size to fix grey area
            setTimeout(() => {
                map.invalidateSize();
            }, 500);
        }

        async function updateRadar(lat, lng) {
            try {
                const query = `[out:json];node(around:3000, ${lat}, ${lng})["amenity"~"hospital|school|cafe|restaurant|college|university|mall|shop|hotel|bank"];out 6;`;
                const response = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
                const data = await response.json();

                let html = "";
                if (data.elements.length === 0) {
                    html = "<div style='padding:20px'>No major landmarks nearby.</div>";
                } else {
                    data.elements.forEach(el => {
                        const name = el.tags.name || "Commercial Point";
                        const type = (el.tags.amenity || "Landmark").toUpperCase();
                        let icon = "fa-building";
                        if (type.includes('HOSP')) icon = "fa-hospital";
                        if (type.includes('REST') || type.includes('CAFE')) icon = "fa-utensils";
                        if (type.includes('SCHO') || type.includes('COLL')) icon = "fa-graduation-cap";

                        html += `
                        <div class="addr-card" onclick="window.open('https://www.google.com/maps/search/${encodeURIComponent(name)}')">
                            <div class="addr-icon"><i class="fas ${icon}"></i></div>
                            <div class="addr-info">
                                <h4>${name}</h4>
                                <p>${type}</p>
                            </div>
                        </div>`;
                    });
                }
                document.getElementById('nearGrid').innerHTML = html;
            } catch (e) {
                console.error("Radar Fail");
            }
        }

        async function getReverseGeocode(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await res.json();
                return data.display_name || "Address Unknown";
            } catch (e) {
                return "Address Unknown";
            }
        }

        function addToLog(address) {
            if (address === lastLoggedAddress || address === "Address Unknown") return;
            lastLoggedAddress = address;

            const container = document.getElementById('movementLog');
            const noData = document.getElementById('noDataMsg');
            if (noData) noData.remove();

            const time = new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `
                <div class="time-badge">${time}</div>
                <div style="font-weight:600; color:#1e293b">${address}</div>
                <div class="ip-badge">${userIP}</div>
            `;
            container.prepend(item);
        }

        function startTracking() {
            if (!navigator.geolocation) {
                alert("Geolocation not supported");
                return;
            }

            document.getElementById('liveStatus').innerHTML = '<i class="fas fa-circle" style="color:var(--success)"></i> LIVE TRACKING';

            // First fix map initialization
            navigator.geolocation.getCurrentPosition(pos => {
                const {
                    latitude,
                    longitude
                } = pos.coords;
                initMap(latitude, longitude);
                updateRadar(latitude, longitude);
            });

            // Start continuous watch
            navigator.geolocation.watchPosition(async pos => {
                const {
                    latitude,
                    longitude
                } = pos.coords;

                if (map) {
                    marker.setLatLng([latitude, longitude]);
                    circle.setLatLng([latitude, longitude]);
                    map.panTo([latitude, longitude]);

                    const address = await getReverseGeocode(latitude, longitude);
                    addToLog(address);

                    const msg = `Arpalink Live: ${address} | Map: https://www.google.com/maps?q=${latitude},${longitude}`;
                    document.getElementById('whatsappBtn').href = `https://wa.me/?text=${encodeURIComponent(msg)}`;
                }

                // Radar update every 30 seconds to save API calls
                if (!window.lastRadarUpdate || Date.now() - window.lastRadarUpdate > 30000) {
                    updateRadar(latitude, longitude);
                    window.lastRadarUpdate = Date.now();
                }

            }, err => {
                alert("Please enable GPS/Location access.");
            }, {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            });
        }
    </script>
</body>

</html>
